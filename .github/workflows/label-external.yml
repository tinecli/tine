name: Label external issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: github.event.issue.user.login != 'gustaferiksson'
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit "$NUMBER" --add-label external
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
