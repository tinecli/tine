name: Release

# On a version tag (v1.2.3) that lives on main: build the app, package a
# Developer ID signed + notarized dmg, attach it to a GitHub Release, and bump
# the Homebrew cask in tinecli/homebrew-tap.
#
# All of these secrets are required — the preflight step fails the run if any is
# empty, so a release is never silently ad-hoc signed or left un-bumped:
#   APPLE_CERT_P12        base64 of the exported "Developer ID Application" cert (.p12)
#   APPLE_CERT_PASSWORD   password used when exporting that .p12
#   NOTARY_APPLE_ID       Apple ID email for notarytool
#   NOTARY_PASSWORD       app-specific password for that Apple ID
#   TAP_GITHUB_TOKEN      token with write access to tinecli/homebrew-tap
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & release
    runs-on: macos-26   # builds on the macOS 26 SDK so releases ship Liquid Glass
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag-on-main guard needs history

      - name: Preflight — every release secret is set
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD TAP_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is empty — refusing to release"
              exit 1
            fi
          done

      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to release"
            exit 1
          fi

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun test

      - name: Import signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$ID" ]; then
            echo "::error::no Developer ID Application identity in the imported keychain"
            exit 1
          fi
          echo "Imported: $ID"
          echo "TINE_SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Package (Developer ID signed + notarized)
        env:
          TINE_VERSION: ${{ steps.ver.outputs.version }}
          TINE_BUILD: ${{ github.run_number }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: "82K3YC8HVF"
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/package.sh

      - name: Verify the artifacts are signed, notarized and stapled
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          APP="dist/Tine.app"
          DMG="dist/Tine-$VERSION.dmg"
          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -dvv "$APP" > "$RUNNER_TEMP/codesign.txt" 2>&1
          grep -q 'Authority=Developer ID Application' "$RUNNER_TEMP/codesign.txt"
          spctl -a -vvv "$APP" > "$RUNNER_TEMP/spctl-app.txt" 2>&1
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl-app.txt"
          spctl -a -vvv -t install "$DMG" > "$RUNNER_TEMP/spctl-dmg.txt" 2>&1
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl-dmg.txt"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

      - name: Compute sha256
        id: sha
        run: |
          echo "sha256=$(shasum -a 256 "dist/Tine-${{ steps.ver.outputs.version }}.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Tine-${{ steps.ver.outputs.version }}.dmg" \
            --title "Tine ${{ steps.ver.outputs.version }}" \
            --notes "Install: \`brew install --cask tinecli/tap/tine\`. Developer ID signed & notarized."

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tinecli/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/tine.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/tine.rb
          grep -q "^  version \"$VERSION\"$" Casks/tine.rb
          grep -q "^  sha256 \"$SHA256\"$" Casks/tine.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "tine $VERSION"
          git push
