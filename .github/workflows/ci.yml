name: CI

# Build-only sanity: proves the engine bundles and the app compiles + packages
# (ad-hoc signed, no spec pack) on every push / PR. No secrets.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-26   # match release.yml — exercise the macOS 26 SDK (Liquid Glass) build
    steps:
      - uses: actions/checkout@v7

      # node stays the runtime for tsc; bun is only the package manager.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install tools
        run: brew install librsvg

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Build engine
        run: bash scripts/build-engine.sh

      - name: Package (ad-hoc, no specs)
        run: TINE_SIGN_ID="-" bash scripts/package.sh --no-specs

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -x dist/Tine.app/Contents/MacOS/tine
          test -f dist/Tine.app/Contents/Resources/tine-engine.js
          test -f dist/Tine.app/Contents/Resources/AppIcon.icns
          echo "✅ app built + icon + engine present"
