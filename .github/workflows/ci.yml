name: CI

# Independent jobs: cheap checks and an sshd forward on Linux, and a real macOS packaging run
# (ad-hoc signed, no notarization). No secrets.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun test

  ssh-forward:
    name: ssh -R to a restricted socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh openssh-server

      # A real sshd forwards a fake app socket; the remote tine.zsh must accept it.
      - name: Forward and talk to the socket
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          app=$(mktemp -d)
          chmod 700 "$app"
          python3 - "$app/remote.sock" <<'PY' &
          import socket, sys
          server = socket.socket(socket.AF_UNIX)
          server.bind(sys.argv[1])
          server.listen()
          while True:
              conn, _ = server.accept()
              line = conn.makefile().readline()
              conn.sendall(b"ci-ok\n" if line.startswith("0123456789abcdef0123456789abcdef\x1fversion\x1f") else b"bad\n")
              conn.close()
          PY
          sleep 1
          token=0123456789abcdef0123456789abcdef
          for n in 1 2; do
            sock=/tmp/tine-ci-$n.sock
            out=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -R "$sock:$app/remote.sock" localhost \
              "stat -c '%a %U %F' $sock; TINE_REMOTE=1 TINE_TOKEN=$token TINE_SOCK=$sock zsh -df -c 'source $PWD/shell/tine.zsh; _tine_req version; print -r -- reply=\$_TINE_REPLY'")
            printf '%s\n' "$out"
            [[ "$out" == "600 $(id -un) socket"$'\n'"reply=ci-ok" ]]
          done

  app:
    name: Package app (ad-hoc signed)
    runs-on: macos-26   # match release.yml — build on the macOS 26 SDK (Liquid Glass)
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Swift tests
        working-directory: app
        run: swift test

      # package.sh builds the Swift app and the engine bundle itself.
      - name: Package
        run: TINE_SIGN_ID="-" bash scripts/package.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -x dist/Tine.app/Contents/MacOS/tine
          test -f dist/Tine.app/Contents/Resources/tine-engine.js
          test -f dist/Tine.app/Contents/Resources/AppIcon.icns
          test -d dist/Tine.app/Contents/Resources/builtin-specs
          test -f dist/Tine.app/Contents/Resources/tine.zsh
