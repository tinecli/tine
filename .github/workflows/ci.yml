name: CI

# Two independent jobs: cheap checks on Linux, and a real macOS packaging run
# (ad-hoc signed, no notarization). No secrets.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun test

  app:
    name: Package app (ad-hoc signed)
    runs-on: macos-26   # match release.yml — build on the macOS 26 SDK (Liquid Glass)
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # package.sh builds the Swift app and the engine bundle itself.
      - name: Package
        run: TINE_SIGN_ID="-" bash scripts/package.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -x dist/Tine.app/Contents/MacOS/tine
          test -f dist/Tine.app/Contents/Resources/tine-engine.js
          test -f dist/Tine.app/Contents/Resources/AppIcon.icns
